name: Daily Stock Data Update Cloud Agent

on:
  schedule:
    # Runs at 21:00 UTC (4:00 PM EST, right after US market close) Monday-Friday
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

# Explicitly grant write access to push updated parquet data back to main branch
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance pyarrow requests beautifulsoup4 lxml html5lib

      - name: Run Fetch Data Engine
        run: python fetch_data.py

      - name: Commit and Push Updated Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_stocks.parquet
          if git diff --cached --quiet; then
            echo "No changes detected in stock metrics dataset."
          else
            git commit -m "Auto-update daily stock metrics [skip ci]"
            git push
          fi
